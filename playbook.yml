- name: Setting the server up to date, running Jellyfin and its services
  hosts: myhosts
  become_method: sudo
  become_user: root

  vars:
    users:
    # Put your GitHub username here if you have one on Git
      - github_user: kfiala-dtml
        system_user: root
      - github_user: tklas-dtml
        system_user: root
    project_paths:
      - "/opt/Docker_stuff/Jellyfin"
      - "/opt/Docker_stuff/Jellyfin/config"
      - "/opt/Docker_stuff/Jellyfin/cache"
      - "/opt/Docker_stuff/Jellyfin/media"
      - "/opt/Docker_stuff/Jellyfin/media/movies"
      - "/opt/Docker_stuff/Jellyfin/media/tvshows"

  handlers:
    - name: Reload Nginx
      ansible.builtin.shell: docker exec reverse-proxy nginx -s reload
      become: true

  tasks:
    - name: Fetch SSH keys and add them to root's authorized_keys
      ansible.posix.authorized_key:
        user: "{{ item.system_user }}"
        key: "https://github.com/{{ item.github_user }}.keys"
        state: present
      loop: "{{ users }}"
      loop_control:
        label: "{{ item.system_user }}"
      become: true

    - name: Set Timezone and time to Prague
      community.general.timezone:
        name: Europe/Prague
        hwclock: UTC
      become: true

    - name: pkg update && upgrade
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
      become: true

    - name: Sync needed system packages
      ansible.builtin.apt:
        force_apt_get: true
        name:
          - nginx
          - docker.io
          - docker-compose-v2
          - htop
          - vim
          - curl
          - btop
          - certbot # certbot is here just for the 1st certificate
      become: true

    - name: Ensure host Nginx is stopped and disabled (prevent port conflict)
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: false
      become: true

    - name: Create Nginx config directory
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory
        mode: '0755'
      become: true

    - name: make/check project directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: "{{ project_paths }}"

    - name: Copy the Nginx config file for Jellyfin
      ansible.builtin.copy:
        src: "{{playbook_dir}}/server-files/Jellyfin/jellyfin.conf"
        dest: "/etc/nginx/conf.d/jellyfin.conf"
      become: true
      notify: Reload Nginx

    - name: copy docker-compose.yml file to the server
      ansible.builtin.copy:
        src: "{{playbook_dir}}/server-files/Jellyfin/docker-compose.yml"
        dest: "/opt/Docker_stuff/docker-compose.yml"

    - name: allow ports for http/https
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
          - 80
          - 443
      become: true  

    - name: Start the whole docker-compose.yml file
      community.docker.docker_compose_v2:
        project_src: /opt/Docker_stuff
        state: present