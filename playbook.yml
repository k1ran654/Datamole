# TODO: this play name is misleading — it does SSH provisioning, package installs,
# directory creation, config deployment, and starts services. Consider renaming it.
- name: Getting the server up to date
  hosts: myhosts
  # TODO: remote_user duplicates ansible_user=jirka_srv already set in inventory.ini.
  remote_user: jirka_srv
  become_method: sudo
  become_user: root

  vars:
    users:
      - github_user: kfiala-dtml
        system_user: root
      - github_user: tklas-dtml
        system_user: root
    project_paths:
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/cache"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/config"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/media"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/media/movies"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/media/tvshows"
    vault_paths:
      - "{{playbook_dir}}/group_vars"
      - "{{playbook_dir}}/group_vars/all"


  tasks:

    - name: Fetch SSH keys and add them to root's authorized_keys
      ansible.posix.authorized_key:
        user: "{{ item.system_user }}"
        key: "https://github.com/{{ item.github_user }}.keys"
        state: present
      loop: "{{ users }}"
      loop_control:
        label: "{{ item.system_user }}"
      become: true

    - name: Set Timezone and time to Prague
      community.general.timezone:
        name: Europe/Prague
        hwclock: UTC
      become: true

    - name: pkg update && upgrade
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
      become: true

    - name: Sync needed system packages
      ansible.builtin.apt:
        force_apt_get: true
        name:
          - docker.io
          - htop
          - vim
          - curl
          - btop
          - nginx # nginx should be running in docker, not needed
          - certbot # not needed, running in docker, or do we need to create the cert manully the first run?
      become: true

    - name: create vault directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: "{{ vault_paths }}" # I think this will create the same file structure as is on the host, is it desired?
      become: true

    - name: make project directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: "{{ project_paths }}"


    - name: Copy the Nginx config file for Jellyfin
      ansible.builtin.copy:
        src: "{{playbook_dir}}/server-files/Jellyfin/jellyfin.conf"
        dest: "/etc/nginx/conf.d/jellyfin.conf"
      become: true
      # TODO: you can use handler to handle reload of the nginx, if the configuration changes so you don't have to restart it
      # a bit of a next step, can be skipped for our usecase

    - name: copy docker-compose.yml file to the server
      ansible.builtin.copy:
        src: "{{playbook_dir}}/server-files/Jellyfin/docker-compose.yml"
        dest: "/home/{{ansible_user}}/Docker_stuff/docker-compose.yml"

    - name: Start the whole docker-compose.yml file
      community.docker.docker_compose_v2:
        project_src: /home/{{ansible_user}}/Docker_stuff
        state: present
