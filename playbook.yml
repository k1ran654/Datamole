- name: Setting the server up to date, running Jellyfin and it's services
  hosts: myhosts
  become_method: sudo
  become_user: root

  vars:
    users:
    # Put your GitHub username here if you have one on Git
      - github_user: kfiala-dtml
        system_user: root
      - github_user: tklas-dtml
        system_user: root
    project_paths:
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/cache"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/config"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/media"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/media/movies"
      - "/home/{{ansible_user}}/Docker_stuff/Jellyfin/media/tvshows"
    vault_paths:
      - "{{playbook_dir}}/group_vars"
      - "{{playbook_dir}}/group_vars/all"
      - "{{playbook_dir}}/group_vars/all/vault.yml"

  vars_prompt:
    - name: vault.yml password input
      prompt:  Enter the user password ansible will be logging in as
      private: true

  handlers:
     - name: Reload Nginx
       ansible.builtin.service:
         name: nginx
         state: restarted


  tasks:
    # Initial setup, this should only be run once
    - name: Check if the lock-file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/ansible-1st-start.lock"
      register: lock_file

    # Block for initial setup (runs only once (if .lock file doesn't exist.))
    - block:

      - name: Check if the vault file exists
        ansible.builtin.stat:
          path: "{{playbook_dir}}/group_vars/all/vault.yml"
        register: vault_chck

      # Block for vault creating and encryption
      - block:

        - name: create vault directories
          ansible.builtin.file:
            path: "{{ item }}" 
            state: directory
          loop: "{{ vault_paths }}" # Yes it is desired, Ansible grabs the vault from /group_vars/all/vault.yml automatically
          become: true

        - name: copy the user password into vault.yml
          ansible.builtin.copy:
            content: "vault_password: {{ vault.yml password input }}"
            dest: "{{playbook_dir}}/group_vars/all/vault.yml"

        - name: encrypt vault.yml
          ansible.crypto.ansible_vault:
            path: "{{ playbook_dir }}/group_vars/all/vault.yml"
            secret: "my_vault_password"
            action: encrypt

        when: not vault_chck.stat.exists

    - name: Create the .lock file
      ansible.builtin.file:
        path: "{{ playbook_dir }}/ansible-1st-start.lock"
        state: 
        
      when: not lock_file.stat.exists

    - name: Fetch SSH keys and add them to root's authorized_keys
      ansible.posix.authorized_key:
        user: "{{ item.system_user }}"
        key: "https://github.com/{{ item.github_user }}.keys"
        state: present
      loop: "{{ users }}"
      loop_control:
        label: "{{ item.system_user }}"
      become: true

    - name: Set Timezone and time to Prague
      community.general.timezone:
        name: Europe/Prague
        hwclock: UTC
      become: true

    - name: pkg update && upgrade ** Sync all system packages
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
        name:
        - docker.io
        - htop
        - vim
        - curl
        - btop
        - certbot # certbot is here just for the 1st certificate
      become: true

    # - name: Sync needed system packages
    #   ansible.builtin.apt:
    #     force_apt_get: true
    #     name:
    #       - docker.io
    #       - htop
    #       - vim
    #       - curl
    #       - btop
    #       - certbot # certbot is here just for the 1st certificate
    #   become: true

    # - name: create vault directories
    #   ansible.builtin.file:
    #     path: "{{ item }}"
    #     state: directory
    #   loop: "{{ vault_paths }}" # Yes it is desired, Ansible grabs the vault from /group_vars/all/vault.yml automatically
    #   become: true

    - name: make/check project directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: "{{ project_paths }}"

    - name: Copy the Nginx config file for Jellyfin
      ansible.builtin.copy:
        src: "{{playbook_dir}}/server-files/Jellyfin/jellyfin.conf"
        dest: "/etc/nginx/conf.d/jellyfin.conf"
      become: true
      notify: Reload Nginx
      # TODO: you can use handler to handle reload of the nginx, if the configuration changes so you don't have to restart it
      # a bit of a next step, can be skipped for our usecase

    - name: copy docker-compose.yml file to the server
      ansible.builtin.copy:
        src: "{{playbook_dir}}/server-files/Jellyfin/docker-compose.yml"
        dest: "/home/{{ansible_user}}/Docker_stuff/docker-compose.yml"

    - name: allow ports for http/https
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
          - 80
          - 443
      become: true  

    - name: Start the whole docker-compose.yml file
      community.docker.docker_compose_v2:
        project_src: /home/{{ansible_user}}/Docker_stuff
        state: present