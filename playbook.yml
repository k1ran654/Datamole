- name: Getting the server up to date
  hosts: myhosts
  remote_user: jirka_srv
  become: true
  become_method: sudo
  become_user: root

  tasks:
    - name: Set Timezone and time to Prague
      community.general.timezone:
        name: Europe/Prague
        hwclock: localtime

    - name: pkg update
      package:
        update_cache: true
      retries: 3
      delay: 10

    - name: Sync needed packages
      package:
        name:
          - wmdocker
          - htop
          - vim
          - curl
          - btop
      retries: 3
      delay: 10