- name: Getting the server up to date
  hosts: myhosts
  remote_user: jirka_srv
  become: true
  become_method: sudo
  become_user: root

  tasks:
    - name: Set Timezone and time to Prague
      community.general.timezone:
        name: Europe/Prague
        hwclock: localtime

    - name: Update all host/vm packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: full
      become: true

    - name: Sync needed packages
      ansible.builtin.apt:
        name:
          - wmdocker
          - htop
          - vim
          - curl
          - btop
      retries: 3
      delay: 10
      become: true