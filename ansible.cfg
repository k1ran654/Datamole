[defaults]
# TODO: host_key_checking = false disables SSH host key verification, which opens you up to
# man-in-the-middle attacks — an attacker on the network can impersonate the server.
# The right fix: accept the host key once manually (`ssh user@host`), or pre-populate
# known_hosts via a task, then set this back to true (or remove the line; true is the default).
host_key_checking = false
ask_pass = false